# (generated by tests/make_golden.sh from commit 17b5145).
data      = tests/data/flows_small.csv
out       = tests/out

# compared parameters
tuple     = full ip
hash      = toeplitz jhash chaskey halfsiphash simpletab
reta      = on off
method    = hash jsq

# static parameters
symmetry  = none xor sort
weighting = flow packet byte
channels  = 8 16 20 32 40 64 128
keys      = 16
window    = 500
