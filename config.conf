data      = data/odid1.csv               # input dataset (flow CSV, 11 columns)
out       = results/baseline.csv         # output file
hash      = toeplitz                     # other: jhash chaskey halfsiphash simpletab multiplyshift siphash xorhash
tuple     = full                         # other: ip
symmetry  = none                         # other: xor sort
reta      = on                           # other: off
scaling      = on                        # other: off
weighting = packet                       # other: flow byte
keys      = 16                           # random keys, results are averaged over them
channels  = 8 16 20 32 40 64 128         # DMA channel counts
window    = 150000                       # packets per window
can_size   = 18750                       # number of packet per canal
